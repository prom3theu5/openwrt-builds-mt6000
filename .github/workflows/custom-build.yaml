name: Build Version

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream Branch'
        required: true
        default: ''
        type: string
      enable_tailscale:
        description: 'Enable Tailscale'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-22.04
    env:
      UPSTREAM_SOURCE_REPO: "https://github.com/pesa1234/openwrt.git"
      UPSTREAM_RELEASE: "2025-04-19_r29721-5111451803_next-r4.5.34.rss.mtk"
      UPSTREAM_RELEASE_CONFIG: "https://raw.githubusercontent.com/pesa1234/MT6000_cust_build/refs/heads/main/2025-04-19_r29721-5111451803_next-r4.5.34.rss.mtk/targets/mediatek/filogic/config.buildinfo"
      UPSTREAM_RELEASE_REPO: "https://github.com/pesa1234/MT6000_cust_build"
      UPSTREAM_RELEASE_BRANCH: "main"

    steps:
      - name: Set current date and time in environment
        run: echo "BUILD_DATE_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
      
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_SOURCE_REPO }}
          ref: ${{ github.event.inputs.upstream_branch }}
          fetch-depth: 0
          
      - name: Set up Build Environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync swig unzip zlib1g-dev file wget llvm

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "Feeds updated and installed successfully."
          
      - name: Get last release config file
        run: |
          wget -O .config ${{ env.UPSTREAM_RELEASE_CONFIG }}
          echo "Config file downloaded successfully."
          
      - name: Enable Tailscale
        if: ${{ github.event.inputs.enable_tailscale == 'true' }}
        run: echo "CONFIG_PACKAGE_tailscale=y" >> .config
          
      - name: Download all
        run: make download
          
      - name: Build OpenWrt
        run: |
          make -j$(nproc)
          echo "Build completed successfully."
          
      - name: Attach artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-pesa1234-mt6000-CI-${{ env.BUILD_DATE_TIME }}-${{ github.run_number }}-sysupgrade.bin
          path: bin/targets/**/**/*mt6000-squashfs-sysupgrade.bin